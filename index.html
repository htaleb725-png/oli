<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام مكتب النائب علا الناشي</title>
    <meta name="description" content="النظام الإداري والمكتبي المتكامل لمكتب النائب علا الناشي لإدارة المراجعين، الطلبات، مقابلات النائب، الأرشيف، وبطاقات المعلومات الرسمية" />
    <meta property="og:title" content="نظام مكتب النائب علا الناشي" />
    <meta property="og:description" content="النظام الإداري والمكتبي المتكامل لمكتب النائب علا الناشي لإدارة المراجعين، الطلبات، مقابلات النائب، الأرشيف، وبطاقات المعلومات الرسمية" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مكتب النائب علا الناشي" />
    <meta name="application-name" content="مكتب النائب علا الناشي" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Google Identity Services for direct robust OAuth without Firebase Auth unauthorized-domain issues -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // GitHub Pages relative routing & trailing slash safeguard
      (function() {
        if (location.hostname.endsWith('github.io')) {
          // Normalize trailing slash for relative assets resolution
          if (!location.pathname.endsWith('/') && !location.pathname.includes('.')) {
            location.replace(location.pathname + '/' + location.search + location.hash);
            return;
          }
          // If GitHub Pages is serving from repository root (where raw main.tsx cannot run), redirect to /docs/
          if (!location.pathname.includes('/docs') && !location.pathname.includes('/dist')) {
            var currentPath = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
            // Only redirect if this index.html is the raw unbundled source version
            var scripts = document.querySelectorAll('script[src*="main.tsx"]');
            if (scripts.length > 0) {
              location.replace(currentPath + 'docs/' + location.search + location.hash);
              return;
            }
          }
        }
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 font-['Cairo',sans-serif] antialiased selection:bg-amber-500 selection:text-slate-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Unregister any stale/corrupted service workers on GitHub Pages to prevent white screen
      if (location.hostname.endsWith('github.io') && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) {
            r.unregister();
          }
        });
      } else if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', () => {
          try {
            const swPath = new URL('./sw.js', window.location.href).href;
            navigator.serviceWorker.register(swPath).catch((err) => {
              console.warn('Service Worker skipped:', err);
            });
          } catch (e) {
            console.warn('Service Worker error:', e);
          }
        });
      }
    </script>
  </body>
</html>
